<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRPF 2025</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>💰 Calculadora IRPF 2025</h1>
            <p class="subtitulo">Descubra o valor do seu imposto de renda</p>

            <label for="salario">Digite seu salário</label>

            <input 
                type="number" 
                id="salario" 
                placeholder="Ex: 3500"
            >

            <div class="botoes">
                <button class="btn-calcular" onclick="calcular()">
                    Calcular
                </button>

                <button class="btn-limpar" onclick="limpar()">
                    Limpar
                </button>
            </div>

            <div id="resultado"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
